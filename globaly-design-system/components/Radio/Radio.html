<!-- @dsCard group="Components" name="Radio" subtitle="Single radios and a controlled RadioGroup" viewport="700x180" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; padding: 24px; }
  .wrap { display: flex; gap: 64px; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #94A3B8; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { RadioGroup, Radio } = window.GlobalyDesignSystem_c92b6a;
  function Demo() {
    const [v, setV] = React.useState('student');
    return (
      <div className="wrap">
        <div>
          <div className="label">Visa type</div>
          <RadioGroup value={v} onChange={setV} options={[
            { value: 'student', label: 'Student visa' },
            { value: 'work', label: 'Work permit' },
            { value: 'visitor', label: 'Visitor visa' },
          ]} />
        </div>
        <div>
          <div className="label">States</div>
          <RadioGroup value="a" options={[
            { value: 'a', label: 'Selected' },
            { value: 'b', label: 'Unselected' },
            { value: 'c', label: 'Disabled', disabled: true },
          ]} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

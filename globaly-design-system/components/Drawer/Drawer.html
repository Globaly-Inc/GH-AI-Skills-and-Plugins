  const { Drawer, Button, Field, Input, Select } = window.GlobalyDesignSystem_c92b6a;

    const [open, setOpen] = React.useState(true);
    return (
      <div>
        <Button onClick={() => setOpen(true)}>Open drawer</Button>
        <Drawer open={open} title="New application" onClose={() => setOpen(false)}
          footer={<>

            <Button variant="primary" size="md" onClick={() => setOpen(false)}>Create</Button>
          </>}>

            <Field label="Applicant name"><Input placeholder="e.g. Maria Silva" /></Field>
            <Field label="Visa type"><Select placeholder="Select type" options={[{value:'s',label:'Student Visa'},{value:'w',label:'Work Permit'}]} /></Field>

    );

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; padding: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Table, StatusBadge } = window.GlobalyDesignSystem_c92b6a;
  function Demo() {
    const columns = [
      { key: 'id', header: 'ID', render: v => <span style={{color:'#94A3B8',fontSize:12}}>{v}</span> },
      { key: 'name', header: 'Applicant', render: v => <span style={{fontWeight:500}}>{v}</span> },
      { key: 'type', header: 'Type' },
      { key: 'status', header: 'Status', render: v => <StatusBadge status={v} /> },
      { key: 'date', header: 'Date', align: 'right', render: v => <span style={{color:'#94A3B8',fontSize:12}}>{v}</span> },
    ];
    const data = [
      { id: 'APP-001', name: 'Maria Silva', type: 'Student Visa', status: 'In Review', date: 'May 20' },
      { id: 'APP-002', name: 'James Okafor', type: 'Work Permit', status: 'Approved', date: 'May 18' },
      { id: 'APP-003', name: 'Li Wei', type: 'Visitor Visa', status: 'Pending', date: 'May 17' },
      { id: 'APP-004', name: 'Priya Nair', type: 'Permanent Res.', status: 'Rejected', date: 'May 12' },
    ];
    return <Table columns={columns} data={data} onRowClick={() => {}} />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

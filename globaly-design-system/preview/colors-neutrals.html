<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color Primitives" subtitle="Slate neutral scale + Red error scale + GlobalyOS purple custom scale" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 20px; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #94A3B8; margin-bottom: 10px; }
  .scale { display: flex; gap: 4px; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chip { height: 40px; width: 100%; border-radius: 6px; border: 1px solid rgba(0,0,0,.04); }
  .step-label { font-size: 9px; color: #94A3B8; }
  .step-val { font-size: 8px; color: #CBD5E1; }
  .section { margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Slate — Primary Neutral</div>
    <div class="scale">
      <div class="step"><div class="chip" style="background:#F8FAFC;"></div><div class="step-label">50</div></div>
      <div class="step"><div class="chip" style="background:#F1F5F9;"></div><div class="step-label">100</div></div>
      <div class="step"><div class="chip" style="background:#E2E8F0;"></div><div class="step-label">200</div></div>
      <div class="step"><div class="chip" style="background:#CBD5E1;"></div><div class="step-label">300</div></div>
      <div class="step"><div class="chip" style="background:#94A3B8;"></div><div class="step-label">400</div></div>
      <div class="step"><div class="chip" style="background:#64748B;"></div><div class="step-label">500</div></div>
      <div class="step"><div class="chip" style="background:#475569;"></div><div class="step-label">600</div></div>
      <div class="step"><div class="chip" style="background:#334155;"></div><div class="step-label">700</div></div>
      <div class="step"><div class="chip" style="background:#1E293B;"></div><div class="step-label">800</div></div>
      <div class="step"><div class="chip" style="background:#0F172A;"></div><div class="step-label">900</div></div>
      <div class="step"><div class="chip" style="background:#020617;"></div><div class="step-label">950</div></div>
    </div>
  </div>
  <div class="section">
    <div class="label">Red — Error</div>
    <div class="scale">
      <div class="step"><div class="chip" style="background:#FEF2F2;"></div><div class="step-label">50</div></div>
      <div class="step"><div class="chip" style="background:#FEE2E2;"></div><div class="step-label">100</div></div>
      <div class="step"><div class="chip" style="background:#FECACA;"></div><div class="step-label">200</div></div>
      <div class="step"><div class="chip" style="background:#FCA5A5;"></div><div class="step-label">300</div></div>
      <div class="step"><div class="chip" style="background:#F87171;"></div><div class="step-label">400</div></div>
      <div class="step"><div class="chip" style="background:#EF4444;"></div><div class="step-label">500</div></div>
      <div class="step"><div class="chip" style="background:#DC2626;"></div><div class="step-label">600</div></div>
      <div class="step"><div class="chip" style="background:#B91C1C;"></div><div class="step-label">700</div></div>
      <div class="step"><div class="chip" style="background:#991B1B;"></div><div class="step-label">800</div></div>
      <div class="step"><div class="chip" style="background:#7F1D1D;"></div><div class="step-label">900</div></div>
      <div class="step"><div class="chip" style="background:#450A0A;"></div><div class="step-label">950</div></div>
    </div>
  </div>
  <div class="section">
    <div class="label">Blue — Brand ★</div>
    <div class="scale">
      <div class="step"><div class="chip" style="background:#012E8A;"></div><div class="step-label">navy ★</div></div>
      <div class="step"><div class="chip" style="background:#012670;"></div><div class="step-label">hover</div></div>
      <div class="step"><div class="chip" style="background:#1E40AF;"></div><div class="step-label">active</div></div>
      <div class="step"><div class="chip" style="background:#DBEAFE;"></div><div class="step-label">subtle</div></div>
    </div>
  </div>
  <div class="section">
    <div class="label">GlobalyOS Purple ★</div>
    <div class="scale">
      <div class="step"><div class="chip" style="background:#F4EEFF;"></div><div class="step-label">50</div></div>
      <div class="step"><div class="chip" style="background:#E6D8FF;"></div><div class="step-label">100</div></div>
      <div class="step"><div class="chip" style="background:#D0B5FF;"></div><div class="step-label">200</div></div>
      <div class="step"><div class="chip" style="background:#B184FF;"></div><div class="step-label">300</div></div>
      <div class="step"><div class="chip" style="background:#9152F5;"></div><div class="step-label">400</div></div>
      <div class="step"><div class="chip" style="background:#7A32EA;"></div><div class="step-label">500</div></div>
      <div class="step"><div class="chip" style="background:#6820E4;"></div><div class="step-label">600 ★</div></div>
      <div class="step"><div class="chip" style="background:#5618BF;"></div><div class="step-label">700</div></div>
      <div class="step"><div class="chip" style="background:#461699;"></div><div class="step-label">800</div></div>
      <div class="step"><div class="chip" style="background:#39147A;"></div><div class="step-label">900</div></div>
      <div class="step"><div class="chip" style="background:#22084F;"></div><div class="step-label">950</div></div>
    </div>
  </div>
</body>
</html>

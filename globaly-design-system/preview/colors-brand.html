<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand Color Tokens" subtitle="Primary, hover, subtle & accent per brand mode (Globalyapp · GlobalyOS)" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 20px; }
  .row { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
  .brand-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #94A3B8; margin-bottom: 8px; }
  .swatch-group { display: flex; flex-direction: column; gap: 4px; }
  .swatch { display: flex; align-items: center; gap: 10px; }
  .swatch-dot { width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(0,0,0,.06); flex-shrink: 0; }
  .swatch-info { display: flex; flex-direction: column; gap: 2px; }
  .swatch-name { font-size: 11px; font-weight: 500; color: #334155; }
  .swatch-hex  { font-size: 10px; color: #94A3B8; }
  .divider { width: 1px; background: #E2E8F0; align-self: stretch; margin: 0 4px; }
  .section { flex: 1; min-width: 0; }
</style>
</head>
<body>
  <div class="row">
    <!-- Globalyapp -->
    <div class="section">
      <div class="brand-label" style="color:#7F1D1D;">● Globalyapp</div>
      <div class="swatch-group">
        <div class="swatch"><div class="swatch-dot" style="background:#7F1D1D;"></div><div class="swatch-info"><span class="swatch-name">Primary</span><span class="swatch-hex">#7F1D1D</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#6B1818;"></div><div class="swatch-info"><span class="swatch-name">Hover</span><span class="swatch-hex">#6B1818</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#B91C1C;"></div><div class="swatch-info"><span class="swatch-name">Active</span><span class="swatch-hex">#B91C1C</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#FEE2E2;"></div><div class="swatch-info"><span class="swatch-name">Subtle</span><span class="swatch-hex">#FEE2E2</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#1E293B;"></div><div class="swatch-info"><span class="swatch-name">Secondary</span><span class="swatch-hex">#1E293B</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#C51918;"></div><div class="swatch-info"><span class="swatch-name">Accent</span><span class="swatch-hex">#C51918</span></div></div>
      </div>
    </div>
    <div class="divider"></div>
    <!-- GlobalyOS -->
    <div class="section">
      <div class="brand-label" style="color:#6820E4;">● GlobalyOS</div>
      <div class="swatch-group">
        <div class="swatch"><div class="swatch-dot" style="background:#6820E4;"></div><div class="swatch-info"><span class="swatch-name">Primary</span><span class="swatch-hex">#6820E4</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#5618BF;"></div><div class="swatch-info"><span class="swatch-name">Hover</span><span class="swatch-hex">#5618BF</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#461699;"></div><div class="swatch-info"><span class="swatch-name">Active</span><span class="swatch-hex">#461699</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#E6D8FF;"></div><div class="swatch-info"><span class="swatch-name">Subtle</span><span class="swatch-hex">#E6D8FF</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#1E293B;"></div><div class="swatch-info"><span class="swatch-name">Secondary</span><span class="swatch-hex">#1E293B</span></div></div>
        <div class="swatch"><div class="swatch-dot" style="background:#7A32EA;"></div><div class="swatch-info"><span class="swatch-name">Accent</span><span class="swatch-hex">#7A32EA</span></div></div>
      </div>
    </div>
  </div>
</body>
</html>

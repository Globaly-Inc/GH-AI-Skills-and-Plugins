function DashboardScreen({ onNavigate }) {

function ApplicationTable({ rows, compact = false, onNavigate }) {
  const thStyle = {
    fontSize: 11, fontWeight: 700, color: '#94A3B8',
    textTransform: 'uppercase', letterSpacing: '0.05em',
    padding: compact ? '6px 10px' : '10px 12px',
    borderBottom: '1px solid #F1F5F9',
  };
  const tdStyle = {
    fontSize: 13, color: '#334155', padding: compact ? '9px 10px' : '12px 12px',
    borderBottom: '1px solid #F8FAFC',
    fontFamily: "'Plus Jakarta Sans', sans-serif",
  };
  return (
    <div style={{ overflowX: 'auto' }}>
      <table>
        <thead>
          <tr>
            <th style={thStyle}>ID</th>
            <th style={thStyle}>Applicant</th>
            <th style={thStyle}>Type</th>
            {!compact && <th style={thStyle}>Country</th>}
            <th style={thStyle}>Status</th>
            <th style={thStyle}>Date</th>
            {!compact && <th style={thStyle}>Agent</th>}
            <th style={thStyle}></th>
          </tr>
        </thead>
        <tbody>
          {rows.map(row => (
            <tr key={row.id} style={{ cursor: 'pointer' }}
              onMouseEnter={e => e.currentTarget.style.background = '#FAFAFA'}
              onMouseLeave={e => e.currentTarget.style.background = ''}
            >
              <td style={{...tdStyle, color:'#94A3B8', fontSize:12, fontFamily:"'Inter',monospace"}}>{row.id}</td>
              <td style={tdStyle}><span style={{fontWeight:500}}>{row.name}</span></td>
              <td style={{...tdStyle, color:'#64748B'}}>{row.type}</td>
              {!compact && <td style={tdStyle}>{row.country}</td>}
              <td style={tdStyle}><StatusBadge status={row.status} /></td>
              <td style={{...tdStyle, color:'#94A3B8', fontSize:12}}>{row.date}</td>
              {!compact && <td style={{...tdStyle, color:'#64748B'}}>{row.agent}</td>}
              <td style={tdStyle}>
                <Button variant="ghost" size="xs" onClick={() => onNavigate && onNavigate('applications')}>
                  View
                </Button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function ApplicationsScreen({ onNavigate }) {
  const [search, setSearch] = React.useState('');
  const [statusFilter, setStatusFilter] = React.useState('');

  const filtered = APPLICATIONS.filter(a => {
    const q = search.toLowerCase();
    const matchSearch = !q || a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q) || a.type.toLowerCase().includes(q);
    const matchStatus = !statusFilter || a.status === statusFilter;
    return matchSearch && matchStatus;
  });

  return (
    <div>
      <TopBar
        title="Applications"
        subtitle={`${APPLICATIONS.length} total · ${APPLICATIONS.filter(a=>a.status==='In Review').length} in review`}
        actions={<Button size="sm" onClick={() => onNavigate('new-application')}>+ New Application</Button>}
      />

      {/* Filters */}
      <div style={{ display: 'flex', gap: 10, marginBottom: 20, alignItems: 'center', flexWrap: 'wrap' }}>
        <SearchInput
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search by name, ID or type…"
          style={{ flex: '1 1 200px', maxWidth: 320 }}
        />
        <Select
          value={statusFilter}
          onChange={e => setStatusFilter(e.target.value)}
          placeholder="All statuses"
          options={[
            { value: 'In Review', label: 'In Review' },
            { value: 'Approved',  label: 'Approved' },
            { value: 'Pending',   label: 'Pending' },
            { value: 'Draft',     label: 'Draft' },
            { value: 'Rejected',  label: 'Rejected' },
          ]}
          style={{ width: 160 }}
        />
        {(search || statusFilter) && (
          <Button variant="ghost" size="sm" onClick={() => { setSearch(''); setStatusFilter(''); }}>
            Clear filters
          </Button>
        )}
        <div style={{ marginLeft: 'auto', fontSize: 13, color: '#64748B' }}>
          {filtered.length} result{filtered.length !== 1 ? 's' : ''}
        </div>
      </div>

      <Card padding={0} style={{ overflow: 'hidden' }}>
        <ApplicationTable rows={filtered} onNavigate={onNavigate} />
        {filtered.length === 0 && (
          <div style={{ padding: 40, textAlign: 'center', color: '#94A3B8', fontSize: 14 }}>
            No applications match your filters.
          </div>
        )}
      </Card>
    </div>
  );
}

            <path d="M20 8H8a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V12L20 8z"/>

                        <path d="M1 7s2.5-4.5 6-4.5S13 7 13 7s-2.5 4.5-6 4.5S1 7 1 7z"/>
                        <circle cx="7" cy="7" r="1.5"/>
                      </svg>
                    }/>
                    <IconButton size="sm" variant="ghost" icon={
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="1 9 1 13 5 13"/><line x1="13" y1="1" x2="1" y2="13"/>
                        <polyline points="9 1 13 1 13 5"/>

                  </div>

              </tr>
            ))}
          </tbody>
        </table>
      </Card>

function NewApplicationScreen({ onNavigate }) {
  const [form, setForm] = React.useState({ name:'', email:'', type:'', country:'', notes:'' });

  return (
    <div>
      <TopBar
        title="New Application"

        actions={
          <Button variant="ghost" size="sm" onClick={() => onNavigate('applications')}>

      />
      <div style={{ maxWidth: 640 }}>
        <Card style={{ marginBottom: 16 }}>
          <h3 style={{ fontSize: 14, fontWeight: 600, color: '#1E293B', marginBottom: 16 }}>Applicant Information</h3>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <Field label="Full Name" required>
              <Input size="lg" value={form.name} onChange={set('name')} placeholder="e.g. Maria Silva" />
            </Field>
            <Field label="Email Address" required>
              <Input size="lg" type="email" value={form.email} onChange={set('email')} placeholder="email@example.com" />
            </Field>
            <Field label="Visa / Permit Type" required>
              <Select
                value={form.type} onChange={set('type')}
                placeholder="Select type"
                style={{ height: 48 }}
                options={[
                  {value:'student', label:'Student Visa'},
                  {value:'work', label:'Work Permit'},
                  {value:'visitor', label:'Visitor Visa'},
                  {value:'business', label:'Business Visa'},
                  {value:'pr', label:'Permanent Residency'},
                ]}
              />
            </Field>
            <Field label="Country of Origin" required>
              <Input size="lg" value={form.country} onChange={set('country')} placeholder="e.g. Brazil" />
            </Field>
          </div>
        </Card>
        <Card style={{ marginBottom: 16 }}>
          <h3 style={{ fontSize: 14, fontWeight: 600, color: '#1E293B', marginBottom: 16 }}>Additional Notes</h3>
          <textarea
            value={form.notes}
            onChange={set('notes')}
            placeholder="Any special circumstances or notes for this application…"
            style={{
              width: '100%', height: 96, borderRadius: 8,

          <Button variant="outline" size="lg" onClick={() => onNavigate('applications')}>
            Save as Draft

        </div>
      </div>
    </div>
  );
}

// ─── Main App ────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('gly_screen') || 'dashboard');

  const navigate = s => {
    setScreen(s);
    localStorage.setItem('gly_screen', s);
  };

  const screens = {
    dashboard:       <DashboardScreen onNavigate={navigate} />,
    applications:    <ApplicationsScreen onNavigate={navigate} />,
    documents:       <DocumentsScreen />,
    'new-application': <NewApplicationScreen onNavigate={navigate} />,
    settings:        <SettingsScreen />,
    'report-month':  <div style={{paddingTop:8}}><TopBar title="Month to Date" subtitle="Report for May 2026" /><Card><p style={{color:'#94A3B8',fontSize:14}}>Chart placeholder — connect your analytics integration.</p></Card></div>,
    'report-year':   <div style={{paddingTop:8}}><TopBar title="Year to Date" subtitle="Report for 2026" /><Card><p style={{color:'#94A3B8',fontSize:14}}>Chart placeholder — connect your analytics integration.</p></Card></div>,
    search:          <div style={{paddingTop:8}}><TopBar title="Search" subtitle="Search across applications, documents, and contacts" /><SearchInput placeholder="Start typing to search…" style={{width:400,marginBottom:20}} /><Card><p style={{color:'#94A3B8',fontSize:14}}>Search results will appear here.</p></Card></div>,
    calendar:        <div style={{paddingTop:8}}><TopBar title="Calendar" subtitle="Upcoming appointments and deadlines" /><Card><p style={{color:'#94A3B8',fontSize:14}}>Calendar view — connect your scheduling integration.</p></Card></div>,
    payments:        <div style={{paddingTop:8}}><TopBar title="Payments" subtitle="Manage application fees and invoices" /><Card><p style={{color:'#94A3B8',fontSize:14}}>Payments dashboard — connect GlobalyPay integration.</p></Card></div>,
  };

  return (
    <div style={{
      display: 'flex', height: '100vh', overflow: 'hidden',
      background: '#F8FAFC', padding: 12, gap: 12,
    }}>
      <Sidebar activeScreen={screen} onNavigate={navigate} />
      <div style={{
        flex: 1, overflow: 'auto', padding: '24px 28px',
        background: '#F8FAFC',
      }}>
        {screens[screen] || screens['dashboard']}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
